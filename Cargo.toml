[package]
name = "rust-chatgpt"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
wreq = { version = "6.0.0-rc.28", features = ["json", "cookies"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
headless_chrome = "1.0"
chaser-oxide = "0.2.4"
futures = "0.3"
anyhow = "1.0"
fake = { version = "5.1.0", features = ["chrono"] }
wreq-util = "3.0.0-rc"
urlencoding = "2.1.3"
rand = "0.10.1"
base64 = "0.22.1"
[[example]]
name = "test_otp"
path = "scratch/test_otp.rs"

[[example]]
name = "test_cf"
path = "scratch/test_cf.rs"

[[example]]
name = "test_hybrid"
path = "scratch/test_hybrid.rs"

[workspace]
members = [
    ".",
    "tauri-gui/src-tauri"
]

